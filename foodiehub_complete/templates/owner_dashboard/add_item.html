{% extends 'base.html' %}
{% block title %}Add Menu Item - FoodieHub{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm p-4">
        <h4 class="fw-bold mb-4"><i class="fas fa-plus-circle text-warning me-2"></i>Add Menu Item</h4>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label fw-semibold">Item Name</label><input type="text" name="name" class="form-control" required></div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Category</label>
            <select name="category" class="form-select">
              <option value="Starters">Starters</option><option value="Main Course" selected>Main Course</option>
              <option value="Snacks">Snacks</option><option value="Breads">Breads</option>
              <option value="Desserts">Desserts</option><option value="Beverages">Beverages</option>
            </select>
          </div>
          <div class="mb-3"><label class="form-label fw-semibold">Description</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
          <div class="mb-3"><label class="form-label fw-semibold">Price (₹)</label><input type="number" name="price" class="form-control" step="0.01" min="0" required></div>
          <div class="mb-3"><label class="form-label fw-semibold">Image</label><input type="file" name="image" class="form-control" accept="image/*"></div>
          <div class="mb-3 d-flex gap-4">
            <div class="form-check"><input type="checkbox" name="is_veg" id="is_veg" class="form-check-input" checked><label class="form-check-label fw-semibold" for="is_veg">🌿 Vegetarian</label></div>
            <div class="form-check"><input type="checkbox" name="is_bestseller" id="is_bestseller" class="form-check-input"><label class="form-check-label fw-semibold" for="is_bestseller">⭐ Bestseller</label></div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Add to Menu</button>
          <a href="{% url 'owner_dashboard:menu' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
