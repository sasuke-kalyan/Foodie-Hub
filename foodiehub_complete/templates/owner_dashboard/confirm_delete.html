{% extends 'base.html' %}
{% block title %}Delete Item — FoodieHub{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm text-center p-5">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
        <h5 class="fw-bold mb-2">Delete "{{ item.name }}"?</h5>
        <p class="text-muted mb-4">This action cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger fw-bold px-4 me-2">Yes, Delete</button>
          <a href="{% url 'owner_dashboard:manage_menu' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
