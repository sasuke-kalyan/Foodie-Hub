{% extends 'base.html' %}
{% block title %}Login - FoodieHub{% endblock %}
{% block content %}
<div class="auth-page min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card card border-0 shadow-lg p-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-utensils text-warning me-2"></i>FoodieHub</h2>
            <p class="text-muted">Welcome back! Sign in to continue</p>
          </div>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user text-warning"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-warning"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 fs-5">Login</button>
          </form>
          <p class="text-center mt-3 text-muted">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-warning fw-semibold">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
